<style>
  :root{
    --bg:#0a0a0d;
    --panel:#131316;
    --panel-border:rgba(200,25,35,.35);
    --red:#c81923;
    --red-bright:#ff2d3a;
    --red-dim:#8a3038;
    --text:#eaeaec;
    --text-dim:#8f8f95;
    --display:'Rajdhani',sans-serif;
    --mono:'JetBrains Mono',monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--display);
  }

  body{
    position:relative;
    display:flex;
    justify-content:center;
    padding:36px 18px 48px;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(200,25,35,.07) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(200,25,35,.07) 0 1px, transparent 1px 64px);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 40%, transparent 85%);
            mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 40%, transparent 85%);
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
  }

  header{
    text-align:center;
    margin-bottom:34px;
    animation:boot-in .8s ease-out both;
  }

  .emblem{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    filter:drop-shadow(0 0 8px rgba(255,45,58,.55));
  }

  h1.wordmark{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#f4f4f6;
    text-shadow:0 0 16px rgba(255,45,58,.65);
  }

  .tagline{
    margin-top:8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:var(--text-dim);
  }

  .clock-section{
    text-align:center;
    margin-bottom:30px;
  }

  #clock{
    font-size:clamp(50px,14vw,68px);
    font-weight:700;
    letter-spacing:.04em;
    color:#f6f6f8;
    text-shadow:0 0 20px rgba(255,45,58,.55);
    font-variant-numeric:tabular-nums;
  }

  #date{
    margin-top:6px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.22em;
    text-indent:.22em;
    color:var(--red-dim);
  }

  .divider{
    width:200px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--red), transparent);
    margin:20px auto 0;
    opacity:.7;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:3px;
    padding:20px 18px;
    margin-bottom:14px;
  }

  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:16px;
  }

  .panel-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.22em;
    text-indent:.22em;
    color:var(--text-dim);
  }

  .sync-status{
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.14em;
    color:var(--red-dim);
    opacity:0;
    transition:opacity .3s ease;
  }
  .sync-status.active{opacity:1;}

  .note-form{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }

  #note-input{
    flex:1;
    min-width:0;
    background:#0c0c0f;
    border:1px solid rgba(255,255,255,.09);
    color:var(--text);
    padding:11px 12px;
    font-family:var(--display);
    font-size:15px;
    border-radius:2px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #note-input::placeholder{color:#5c5c62;}
  #note-input:focus{
    border-color:var(--red-bright);
    box-shadow:0 0 0 3px rgba(255,45,58,.15);
  }

  #add-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--red);
    color:var(--red-bright);
    padding:0 18px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.16em;
    text-indent:.16em;
    border-radius:2px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  #add-btn:hover, #add-btn:focus-visible{
    background:rgba(255,45,58,.12);
  }

  #notes-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .note-item{
    border-left:2px solid var(--red);
    background:rgba(255,255,255,.02);
    padding:9px 0 9px 12px;
  }

  .note-time{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:4px;
  }

  .note-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }

  .note-text{
    flex:1;
    margin:0;
    font-size:15px;
    line-height:1.45;
    color:var(--text);
    word-break:break-word;
  }

  .note-del{
    background:none;
    border:none;
    color:var(--red-dim);
    font-size:19px;
    line-height:1;
    padding:0 6px 0 0;
    cursor:pointer;
    transition:color .2s ease;
  }
  .note-del:hover, .note-del:focus-visible{color:var(--red-bright);}

  #empty-state, #loading-state{
    display:none;
    text-align:center;
    padding:20px 0 6px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.05em;
    color:var(--text-dim);
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.16em;
    text-indent:.16em;
    color:rgba(255,255,255,.22);
  }

  :focus-visible{
    outline:2px solid var(--red-bright);
    outline-offset:2px;
  }

  @keyframes boot-in{
    from{opacity:0; transform:translateY(-6px) scale(.97);}
    to{opacity:1; transform:none;}
  }

  @media (prefers-reduced-motion: reduce){
    header{animation:none;}
    *{transition:none !important;}
  }

  .weather-body{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .weather-icon{
    width:38px;
    height:38px;
    flex-shrink:0;
    color:var(--red-bright);
  }
  .weather-icon svg{width:100%;height:100%;display:block;}
  .weather-main{flex:1;min-width:0;}
  .weather-temp{
    font-size:32px;
    font-weight:700;
    color:#f6f6f8;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .weather-cond{
    margin-top:4px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--text-dim);
  }
  .weather-loc{
    flex-shrink:0;
    text-align:right;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    color:var(--red-dim);
    max-width:110px;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    text-align:center;
  }
  .cal-dow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    color:var(--text-dim);
    padding-bottom:6px;
  }
  .cal-day{
    font-size:13px;
    padding:7px 0;
    border-radius:2px;
    color:var(--text);
  }
  .cal-day.other-month{color:rgba(255,255,255,.14);}
  .cal-day.today{
    background:rgba(255,45,58,.14);
    border:1px solid var(--red-bright);
    color:#fff;
    font-weight:700;
    box-shadow:0 0 8px rgba(255,45,58,.4);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg class="emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <line x1="50" y1="8" x2="92" y2="50" stroke="#c81923" stroke-width="3"/>
        <line x1="92" y1="50" x2="50" y2="92" stroke="#c81923" stroke-width="3"/>
        <line x1="50" y1="92" x2="8" y2="50" stroke="#c81923" stroke-width="3"/>
        <line x1="8" y1="50" x2="50" y2="8" stroke="#c81923" stroke-width="3"/>
        <line x1="50" y1="8" x2="50" y2="20" stroke="#ff2d3a" stroke-width="4"/>
        <line x1="50" y1="80" x2="50" y2="92" stroke="#ff2d3a" stroke-width="4"/>
        <line x1="8" y1="50" x2="20" y2="50" stroke="#ff2d3a" stroke-width="4"/>
        <line x1="80" y1="50" x2="92" y2="50" stroke="#ff2d3a" stroke-width="4"/>
        <circle cx="50" cy="50" r="3.5" fill="#ff2d3a"/>
      </svg>
      <h1 class="wordmark">ARASAKA</h1>
      <div class="tagline">PERSONAL TERMINAL</div>
    </header>

    <section class="clock-section">
      <div id="clock">00:00:00</div>
      <div id="date">-</div>
      <div class="divider"></div>
    </section>

    <section class="panel" aria-label="Wetter">
      <div class="panel-head">
        <span class="panel-title">WETTER</span>
        <span class="sync-status" id="weather-status"></span>
      </div>
      <div class="weather-body">
        <div class="weather-icon" id="weather-icon"></div>
        <div class="weather-main">
          <div class="weather-temp" id="weather-temp">--°</div>
          <div class="weather-cond" id="weather-cond">LÄDT…</div>
        </div>
        <div class="weather-loc" id="weather-loc"></div>
      </div>
    </section>

    <section class="panel" aria-label="Kalender">
      <div class="panel-head">
        <span class="panel-title" id="cal-title">-</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <section class="panel" aria-label="Notizen">
      <div class="panel-head">
        <span class="panel-title">LOG ENTRIES</span>
        <span class="sync-status" id="sync-status"></span>
      </div>

      <div class="note-form">
        <input id="note-input" type="text" placeholder="Neuer Eintrag…" maxlength="240" autocomplete="off">
        <button id="add-btn" type="button">LOG</button>
      </div>

      <p id="loading-state">SYSTEM// Verbindung wird hergestellt…</p>
      <p id="empty-state">Keine Einträge. Leg oben deinen ersten Log an.</p>
      <ul id="notes-list"></ul>
    </section>

    <footer>ARASAKA CORP · LOKAL &amp; PRIVAT GESPEICHERT</footer>
  </div>

<script>
  const STORAGE_KEY = 'notes';
  let notes = [];

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('date').textContent =
      now.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  }
  tick();
  setInterval(tick, 1000);

  function setStatus(text, autoHide){
    const el = document.getElementById('sync-status');
    el.textContent = text;
    el.classList.add('active');
    if (autoHide){
      clearTimeout(setStatus._t);
      setStatus._t = setTimeout(() => el.classList.remove('active'), 1600);
    }
  }

  function renderNotes(){
    const list = document.getElementById('notes-list');
    const empty = document.getElementById('empty-state');
    const loading = document.getElementById('loading-state');
    loading.style.display = 'none';
    list.innerHTML = '';

    if (notes.length === 0){
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    notes.slice().reverse().forEach(note => {
      const li = document.createElement('li');
      li.className = 'note-item';

      const time = document.createElement('span');
      time.className = 'note-time';
      time.textContent = note.createdAt;

      const row = document.createElement('div');
      row.className = 'note-row';

      const text = document.createElement('p');
      text.className = 'note-text';
      text.textContent = note.text;

      const del = document.createElement('button');
      del.className = 'note-del';
      del.type = 'button';
      del.setAttribute('aria-label', 'Eintrag löschen');
      del.textContent = '×';
      del.addEventListener('click', () => deleteNote(note.id));

      row.appendChild(text);
      row.appendChild(del);
      li.appendChild(time);
      li.appendChild(row);
      list.appendChild(li);
    });
  }

  async function loadNotes(){
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      notes = result && result.value ? JSON.parse(result.value) : [];
    } catch (e) {
      notes = [];
    }
    renderNotes();
  }

  async function saveNotes(){
    setStatus('SPEICHERT…', false);
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(notes), false);
      if (!result) throw new Error('kein Ergebnis');
      setStatus('GESICHERT', true);
    } catch (e) {
      setStatus('FEHLER BEIM SPEICHERN', true);
    }
  }

  function addNote(){
    const input = document.getElementById('note-input');
    const value = input.value.trim();
    if (!value) return;
    const now = new Date();
    notes.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      text: value,
      createdAt: pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' · ' + pad(now.getDate()) + '.' + pad(now.getMonth()+1) + '.'
    });
    input.value = '';
    renderNotes();
    saveNotes();
    input.focus();
  }

  function deleteNote(id){
    notes = notes.filter(n => n.id !== id);
    renderNotes();
    saveNotes();
  }

  document.getElementById('add-btn').addEventListener('click', addNote);
  document.getElementById('note-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addNote();
  });

  // ---------- Wetter ----------
  const WEATHER_ICONS = {
    sun: '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/>',
    cloud: '<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 8.1 4.5 4.5 0 0 0 7 18Z"/>',
    rain: '<path d="M7 15h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 5.1 4.5 4.5 0 0 0 7 15Z"/><line x1="8" y1="18" x2="7" y2="21"/><line x1="12" y1="18" x2="11" y2="21"/><line x1="16" y1="18" x2="15" y2="21"/>',
    snow: '<path d="M7 15h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 5.1 4.5 4.5 0 0 0 7 15Z"/><line x1="8" y1="18" x2="8" y2="21"/><line x1="6.5" y1="19.5" x2="9.5" y2="19.5"/><line x1="16" y1="18" x2="16" y2="21"/><line x1="14.5" y1="19.5" x2="17.5" y2="19.5"/>',
    storm: '<path d="M7 14h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 4.1 4.5 4.5 0 0 0 7 14Z"/><polyline points="13,15 10,19 13,19 11,23"/>',
    fog: '<line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="16" x2="21" y2="16"/>'
  };

  function weatherInfo(code){
    if (code === 0) return { label: 'KLARER HIMMEL', icon: 'sun' };
    if ([1,2].includes(code)) return { label: 'LEICHT BEWÖLKT', icon: 'cloud' };
    if (code === 3) return { label: 'BEDECKT', icon: 'cloud' };
    if ([45,48].includes(code)) return { label: 'NEBEL', icon: 'fog' };
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return { label: 'REGEN', icon: 'rain' };
    if ([71,73,75,77,85,86].includes(code)) return { label: 'SCHNEE', icon: 'snow' };
    if ([95,96,99].includes(code)) return { label: 'GEWITTER', icon: 'storm' };
    return { label: 'UNBEKANNT', icon: 'cloud' };
  }

  function setWeatherIcon(name){
    const box = document.getElementById('weather-icon');
    box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + WEATHER_ICONS[name] + '</svg>';
  }

  async function loadWeather(){
    const tempEl = document.getElementById('weather-temp');
    const condEl = document.getElementById('weather-cond');
    const locEl = document.getElementById('weather-loc');

    if (!('geolocation' in navigator)){
      condEl.textContent = 'STANDORT NICHT UNTERSTÜTZT';
      setWeatherIcon('cloud');
      return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude, longitude } = pos.coords;
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        if (!res.ok) throw new Error('forecast fehlgeschlagen');
        const data = await res.json();
        const cw = data.current_weather;
        const info = weatherInfo(cw.weathercode);
        tempEl.textContent = Math.round(cw.temperature) + '°';
        condEl.textContent = info.label;
        setWeatherIcon(info.icon);
      } catch (e) {
        condEl.textContent = 'DATEN NICHT VERFÜGBAR';
        setWeatherIcon('cloud');
      }

      try {
        const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=de`);
        if (geoRes.ok){
          const geo = await geoRes.json();
          locEl.textContent = (geo.city || geo.locality || '').toUpperCase();
        }
      } catch (e) { /* Standortname ist optional */ }

    }, (err) => {
      condEl.textContent = 'STANDORT VERWEIGERT';
      setWeatherIcon('cloud');
    }, { timeout: 8000 });
  }

  // ---------- Kalender ----------
  function buildCalendar(){
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const today = now.getDate();
    const monthNames = ['JANUAR','FEBRUAR','MÄRZ','APRIL','MAI','JUNI','JULI','AUGUST','SEPTEMBER','OKTOBER','NOVEMBER','DEZEMBER'];
    document.getElementById('cal-title').textContent = monthNames[month] + ' ' + year;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    ['MO','DI','MI','DO','FR','SA','SO'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1);
    const startIndex = (firstDay.getDay() + 6) % 7; // Montag = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    for (let i = 0; i < startIndex; i++){
      const el = document.createElement('div');
      el.className = 'cal-day other-month';
      el.textContent = daysInPrevMonth - startIndex + 1 + i;
      grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++){
      const el = document.createElement('div');
      el.className = 'cal-day' + (d === today ? ' today' : '');
      el.textContent = d;
      grid.appendChild(el);
    }
    const remainder = (startIndex + daysInMonth) % 7;
    if (remainder !== 0){
      const fill = 7 - remainder;
      for (let d = 1; d <= fill; d++){
        const el = document.createElement('div');
        el.className = 'cal-day other-month';
        el.textContent = d;
        grid.appendChild(el);
      }
    }
  }

  document.getElementById('loading-state').style.display = 'block';
  loadNotes();
  loadWeather();
  buildCalendar();
</script>
</body>
</html>
